<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellwerk</title>
<style>
@font-face{font-family:"Barlow SC";font-weight:400;font-display:swap;src:url(/fonts/barlow-semi-condensed-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow SC";font-weight:500;font-display:swap;src:url(/fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow SC";font-weight:600;font-display:swap;src:url(/fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Drei Flächen in drei Tönen: Ablage (Stahl), Arbeitsfläche (Weiß), Ausgabe (dunkel). Farbe nur als Signal. */
:root{--side:#E2E5E8;--src:#EEF0F2;--work:#FFFFFF;--field:#FFFFFF;--hover:#F3F4F6;--line:#D3D7DC;--rule:#000000;
--ink:#000000;--mut:#55606B;--dim:#8A949E;--paper:#FFFFFF;
--gruen:#00875A;--gelb:#E5A800;--gelbtext:#7A5600;--rot:#D4002A;--blau:#0057D9;
--sans:"Barlow SC","Barlow Semi Condensed","DIN 2014","Bahnschrift","Arial Narrow",system-ui,sans-serif;--mono:"Plex Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--side:#16191C;--src:#1C1F23;--work:#23272C;--field:#16191C;--hover:#2B3036;--line:#3A4047;--rule:#F2F4F6;
--ink:#F2F4F6;--mut:#A9B2BB;--dim:#727C86;--paper:#16191C;--gruen:#2FBF8A;--gelb:#F2B84B;--gelbtext:#F2B84B;--rot:#FF5C7A;--blau:#6AA5FF}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--work);color:var(--ink);font:15px/1.35 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blau);outline-offset:1px}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;flex:none}
#app{display:grid;grid-template-columns:var(--navw,256px) 1fr;height:100%}
/* Ablage */
aside{background:var(--side);display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 18px;font-size:23px;font-weight:600;letter-spacing:.01em;line-height:1}
.brand span{width:26px;height:26px;background:var(--ink);display:grid;place-items:center;color:var(--paper)}
.navh{display:flex;align-items:center;justify-content:space-between;padding:0 8px 4px 16px;font-weight:600}
.tree{flex:1;overflow:auto;padding:0 8px 12px}
.node{display:flex;align-items:center;gap:7px;height:30px;padding:0 6px;cursor:pointer;white-space:nowrap}
.node:hover{background:rgba(127,127,127,.14)}.node.sel{background:var(--work);box-shadow:inset 3px 0 0 var(--blau);font-weight:600}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;background:none;border:0;color:inherit;font-weight:inherit;text-align:left;padding:0;height:100%;cursor:pointer}
.node .chev{transition:transform .1s;color:var(--mut)}.node.open .chev{transform:rotate(90deg)}
.node .acts{display:none;gap:0}.node:hover .acts,.node:focus-within .acts{display:flex}
.ib{width:24px;height:24px;display:grid;place-items:center;border:0;background:none;color:var(--mut);cursor:pointer}
.ib:hover{background:var(--ink);color:var(--paper)}.ib.dang{color:var(--rot)}.ib.dang:hover{background:var(--rot);color:#fff}
.node input{flex:1;min-width:0;height:24px;border:2px solid var(--blau);background:var(--field);padding:0 6px}
.kids{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
.navf{padding:10px 16px 12px;color:var(--mut);font-size:13px}
.hint{padding:8px 10px;color:var(--mut)}
/* Kopf */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px;border-bottom:2px solid var(--rule);min-height:60px}
.crumb{color:var(--mut);font-size:13px}.bar h1{margin:0;font-size:24px;font-weight:600;line-height:1.1}
.bar .sp{flex:1}.satz{color:var(--mut);max-width:46ch}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:1.5px solid var(--ink);border-radius:3px;background:transparent;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper)}.btn:disabled,.btn[aria-disabled=true]{opacity:.35;cursor:default;pointer-events:none}
.btn.pri{background:var(--ink);color:var(--paper)}.btn.pri:hover{background:var(--blau);border-color:var(--blau);color:#fff}
.btn.sm{height:26px;padding:0 9px;font-size:14px;border-width:1px}
/* Zustand als Lampe mit Wort, nie als getönte Pille */
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;--lampe:var(--dim)}
.tag::before{content:"";width:9px;height:9px;flex:none;background:var(--lampe);outline:1.5px solid var(--lampe);outline-offset:-1.5px}
.tag.ok{--lampe:var(--gruen)}.tag.pruefen{--lampe:var(--gelb)}.tag.fehler{--lampe:var(--rot)}.tag.info{--lampe:var(--dim)}
.tag.ki{--lampe:var(--blau)}.tag.ki::before{background:transparent}
.tag.badge{font-size:17px;font-weight:600;gap:8px}.tag.badge::before{width:13px;height:13px}
/* Flächen */
.panes{flex:1;display:grid;grid-template-columns:var(--c1,1fr) 5px var(--c2,1.25fr) 5px var(--c3,1fr);min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--work)}
.pane.src{background:var(--src)}
.pane.out{--work:#17191C;--field:#0E1012;--hover:#22262B;--line:#33393F;--rule:#F2F4F6;--ink:#F2F4F6;--mut:#A9B2BB;--dim:#6B7580;--paper:#17191C;
--gruen:#2FBF8A;--gelb:#F2B84B;--gelbtext:#F2B84B;--rot:#FF5C7A;--blau:#6AA5FF;background:var(--work);color:var(--ink)}
.split{background:var(--src);cursor:col-resize;border:0;padding:0}.split+.pane+.split{background:var(--work)}.split:hover,.split:focus-visible{background:var(--blau)}
.ph{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;flex:none}
.ph h2{margin:0;font-size:17px;font-weight:600}
.tabs{display:flex;gap:18px;height:100%}.tab{border:0;background:none;padding:0;font-size:17px;font-weight:500;color:var(--mut);cursor:pointer;box-shadow:inset 0 -3px 0 transparent;height:100%}
.tab:hover{color:var(--ink)}.tab[aria-selected=true]{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--ink)}
.pb{flex:1;overflow:auto;min-height:0;border-top:1px solid var(--line)}.pad{padding:10px 14px}.mut{color:var(--mut)}.mono{font-family:var(--mono);font-size:12.5px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}.seg button{border:0;background:transparent;height:24px;padding:0 10px;font-size:14px;font-weight:500;cursor:pointer}
.seg button:hover{background:var(--hover)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
pre.code{margin:0;font:12.5px/1.55 var(--mono);counter-reset:l;padding:8px 0}
pre.code span.l{display:block;padding:0 12px 0 50px;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.55em}
pre.code span.l::before{counter-increment:l;content:counter(l);position:absolute;left:0;width:38px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
pre.code span.l:hover{background:var(--hover)}
.k{color:var(--ink)}.s{color:var(--gruen)}.n{color:var(--gelbtext)}.pane.out .s{color:#8FD3B0}
.seg3{font-weight:500;box-shadow:inset 0 -2px 0 var(--gelb)}
/* Spaltenliste und Profil */
.colrow{display:grid;grid-template-columns:10px minmax(0,auto) minmax(0,1fr) auto;gap:9px;align-items:center;width:100%;height:30px;padding:0 14px;border:0;background:none;text-align:left;cursor:pointer}
.colrow:hover{background:var(--hover)}.colrow.sel{background:var(--work);box-shadow:inset 3px 0 0 var(--blau)}
.colrow .cn{font:500 12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colrow .ct{font:12px var(--mono);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.colrow .cm{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.sq{width:9px;height:9px;outline:1.5px solid var(--dim);outline-offset:-1.5px}.sq.ok{background:var(--gruen);outline-color:var(--gruen)}.sq.ki{outline-color:var(--blau)}.sq.pruefen{background:var(--gelb);outline-color:var(--gelb)}.sq.info{background:var(--dim)}
.profbox{padding:12px 14px 14px;background:var(--work);border-top:2px solid var(--rule);position:sticky;bottom:0}
dl.prof{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}dl.prof dt{color:var(--mut)}dl.prof dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px 14px}.chip{font:12.5px var(--mono)}.chip i{font-style:normal;color:var(--mut)}
/* Mapping: jede Zeile ist ein Fahrweg von der Quelle zum Ziel */
table.map{border-collapse:collapse;width:100%;table-layout:fixed;min-width:640px}
table.map th{position:sticky;top:0;z-index:1;background:var(--work);text-align:left;height:32px;padding:0 10px;border-bottom:1px solid var(--line);font-weight:500;color:var(--mut);white-space:nowrap}
table.map th:nth-child(1){width:16%}table.map th:nth-child(2){width:56px}table.map th:nth-child(3){width:25%}table.map th:nth-child(4){width:13%}
table.map td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden}table.map tr:hover td{background:var(--hover)}
table.map .col{font:500 12.5px var(--mono);overflow:hidden;text-overflow:ellipsis}table.map .smp{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.map select.in{font:12.5px var(--mono);width:100%;height:28px}table.map input.in{height:28px}
table.map td.rt{position:relative;padding:0}
td.rt::before{content:"";position:absolute;left:2px;right:11px;top:50%;margin-top:-1px;border-top:2px solid var(--ink)}
td.rt::after{content:"";position:absolute;right:2px;top:50%;margin-top:-5px;border-left:9px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
td.rt.prop::before{border-top-style:dashed;border-color:var(--blau)}td.rt.prop::after{border-left-color:var(--blau)}
td.rt.open::before{right:50%;border-color:var(--gelb)}td.rt.open::after{right:50%;margin-top:-7px;margin-right:-3px;border:0;width:3px;height:14px;background:var(--gelb)}
td.rt.off::before{right:62%;border-color:var(--dim)}td.rt.off::after{display:none}
table.map tr.ai td,.blk.ai .bh{background-image:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--blau) 9%,transparent) 7px 8px)}
table.map tr.why td{color:var(--mut);padding-top:0;white-space:normal;overflow-wrap:anywhere}table.map tr.ai:not(.why) td{border-bottom:0}
table.map tr.cur td{box-shadow:inset 0 2px 0 var(--blau),inset 0 -2px 0 var(--blau)}
.status{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;min-height:30px;padding:3px 16px;background:var(--side);font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.status b{font-weight:600;color:var(--ink)}.dot{display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--dim)}.dot.ok{background:var(--gruen)}.dot.pruefen{background:var(--gelb)}.dot.fehler{background:var(--rot)}.dot.ki{background:transparent;outline:1.5px solid var(--blau);outline-offset:-1.5px}
/* Felder */
label.f{display:flex;flex-direction:column;gap:3px;font-weight:500;color:var(--mut)}
.in{height:30px;border:1px solid var(--dim);border-radius:3px;background:var(--field);color:var(--ink);padding:0 8px;font:12.5px var(--mono);min-width:0;width:100%}
textarea.in{height:104px;padding:6px 8px;resize:vertical}.in:hover{border-color:var(--ink)}.in:disabled{opacity:.55}select.in{font:15px var(--sans)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
/* Textblöcke */
.blk{border-bottom:1px solid var(--line)}.bh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 14px;z-index:1;background:var(--work);border-bottom:1px solid var(--line);position:sticky;top:0}
.bh select{height:28px;max-width:230px;font-weight:600}.bh .orig{font:12.5px var(--mono);color:var(--mut)}
.ln{display:grid;grid-template-columns:1fr auto;gap:12px;padding:1px 14px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}
.ln:hover{background:var(--hover)}.ln.low{box-shadow:inset 4px 0 0 var(--gelb)}.ln .o{font:13px var(--sans);color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
mark{background:var(--gelb);color:#000;padding:0 2px}
ol.fl{list-style:none;margin:0;padding:0}ol.fl li{padding:10px 14px;border-bottom:1px solid var(--line)}
ol.fl .wo{font:500 12.5px var(--mono)}.tun{margin-top:5px;padding-left:10px;border-left:3px solid var(--ink)}
table.t{border-collapse:collapse;width:100%;font:12.5px var(--mono)}table.t th{position:sticky;top:0;background:var(--src);text-align:left;height:30px;padding:0 10px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
table.t td{padding:5px 10px;border-bottom:1px solid var(--line);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}table.t tr:hover td{background:var(--hover)}
.empty{flex:1;display:grid;place-items:center;text-align:left;color:var(--mut);padding:24px}.empty>div{max-width:44ch}.empty b{display:block;color:var(--ink);font-size:28px;font-weight:600;line-height:1.1;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
/* Ankreuzfeld, Vorschläge für Abfragen */
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;cursor:pointer}.chk input{width:15px;height:15px;margin:0;accent-color:var(--ink);cursor:pointer}
.vs{padding:10px 14px;border-bottom:1px solid var(--line)}.vs ul{margin:6px 0 0;padding-left:18px;color:var(--mut)}.vs li{margin:2px 0}
.vs pre{margin:8px 0;padding:8px 10px;background:var(--field);border:1px solid var(--line);font:12px/1.5 var(--mono);max-height:230px;overflow:auto;white-space:pre}
.toast{position:fixed;right:16px;bottom:44px;max-width:440px;padding:10px 14px;background:var(--ink);color:var(--paper);font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:9px;align-items:baseline}
.toast::before{content:"";width:9px;height:9px;flex:none;background:var(--rot)}.toast.ok::before{background:var(--gruen)}
@media (max-width:980px){#app{grid-template-columns:1fr;height:auto}aside{max-height:40vh}.panes{grid-template-columns:1fr;grid-auto-rows:minmax(320px,auto)}.split{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<aside>
  <div class="brand"><span aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h5l6 10h5"/><path d="M4 17h5l2-3.3"/><path d="M15 7h5"/></svg></span>Stellwerk</div>
  <div class="navh"><span>Projekte</span><button class="ib" id="addroot" aria-label="Neues Projekt" title="Neues Projekt"></button></div>
  <nav class="tree" id="tree" aria-label="Projekte"></nav>
  <div class="navf">Daten bleiben auf diesem Rechner.</div>
</aside>
<main id="main"></main>
</div>
<script>
"use strict";
const ICON = {
  chev:'<path d="m9 18 6-6-6-6"/>', folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', fplus:'<path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>', down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  pen:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', send:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'
};
const icon = n => { const t = document.createElement('template'); t.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`; return t.content.firstChild; };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (k in e && k !== 'list') e[k] = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const S = { tree: {kinder: []}, vorlagen: [], sel: null, task: null, lauf: null, busy: false, edit: null, del: null, tabM: 'zuordnung', tabO: 'json' };
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 12);
async function api(method, path, body, raw) {
  const r = await fetch('/api/' + path, { method, body: raw ? body : body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ fehler: 'Unerwartete Antwort des Dienstes.' }));
  if (!r.ok) throw new Error(j.fehler || 'Fehler ' + r.status);
  return j;
}
function toast(msg, cls) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = h('div', { class: 'toast ' + (cls || 'fehler'), role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 6000); }

/* ---------- Explorer ---------- */
function find(id, list = S.tree.kinder, trail = []) { for (const n of list) { if (n.id === id) return { n, list, trail: [...trail, n] }; if (n.kinder) { const r = find(id, n.kinder, [...trail, n]); if (r) return r; } } return null; }
async function saveTree() { try { await api('PUT', 'baum', S.tree); } catch (e) { toast(e.message); } }
function addNode(parent, typ) {
  const n = { id: uid(), name: typ === 'ordner' ? 'Neuer Ordner' : 'Neue Aufgabe', typ, ...(typ === 'ordner' ? { kinder: [], offen: true } : {}) };
  (parent ? parent.kinder : S.tree.kinder).push(n); if (parent) parent.offen = true;
  S.edit = n.id; saveTree(); drawTree();
}
function drawTree() {
  const root = document.getElementById('tree'); root.replaceChildren();
  if (!S.tree.kinder.length) root.append(h('p', { class: 'hint' }, 'Noch kein Projekt. Mit + ein Projekt anlegen, z. B. „Krankenhaus A“, darunter Ordner und Aufgaben.'));
  const draw = (list, into) => list.forEach(n => {
    const isF = n.typ === 'ordner';
    const row = h('div', { class: 'node' + (S.sel === n.id ? ' sel' : '') + (isF && n.offen ? ' open' : '') });
    if (isF) { const c = icon('chev'); c.classList.add('chev'); row.append(c); }
    row.append(icon(isF ? 'folder' : 'file'));
