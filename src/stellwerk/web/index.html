<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellwerk</title>
<style>
:root{--nav:#0B1526;--nav2:#15243D;--navsel:#1A2C4A;--navln:#1C2B45;--navink:#D5DEEB;--navmut:#8496B0;--navacc:#38BDD8;
--bg:#F3F5F8;--panel:#FFFFFF;--sub:#F7F8FA;--hover:#F1F3F6;--line:#E3E7ED;--focus:#94A3B8;--ink:#0B1324;--mut:#4B5870;--dim:#94A0B4;
--acc:#0E7490;--acch:#155E75;--accfg:#FFFFFF;--ok:#047857;--okbg:#ECFDF5;--okln:#A7F3D0;--warn:#B45309;--warnbg:#FFFBEB;--warnln:#FDE68A;
--err:#BE123C;--errbg:#FFF1F2;--errln:#FECDD3;--ai:#4338CA;--aibg:#EEF2FF;--ailn:#C7D2FE;
--shp:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);--shf:0 8px 24px rgba(11,21,38,.12),0 2px 6px rgba(11,21,38,.06);
--sans:Geist,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
--js:#0E6177;--jk:#334155;--jn:#9A3412}
@media (prefers-color-scheme:dark){:root{--nav:#050A14;--nav2:#0F1A2D;--navsel:#13223A;--navln:#142036;
--bg:#070D18;--panel:#0D1626;--sub:#111C2F;--hover:#14213A;--line:#1D2A40;--focus:#50607C;--ink:#EEF2F8;--mut:#A3B1C6;--dim:#5D6B84;
--acc:#22B5D3;--acch:#4CC7E0;--accfg:#04131A;--ok:#34D399;--okbg:#06231B;--okln:#065F46;--warn:#FBBF24;--warnbg:#241805;--warnln:#78350F;
--err:#FB7185;--errbg:#2A0A12;--errln:#881337;--ai:#A5B4FC;--aibg:#13153A;--ailn:#3730A3;
--shp:0 1px 2px rgba(0,0,0,.3);--shf:0 12px 32px rgba(0,0,0,.5);--js:#7DD3E8;--jk:#CBD5E1;--jn:#FDBA74}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);font-feature-settings:"cv02","cv03","cv04","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:var(--navw,264px) 1fr;height:100%}
/* Explorer */
aside{background:var(--nav);color:var(--navink);display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--navln)}
.brand{display:flex;align-items:center;gap:9px;padding:14px 14px 12px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{width:24px;height:24px;border-radius:6px;background:#fff;display:grid;place-items:center;color:var(--nav)}
.navh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navmut)}
.tree{flex:1;overflow:auto;padding:0 6px 12px}
.node{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px;border-radius:4px;cursor:pointer;color:var(--navink);white-space:nowrap}
.node:hover{background:var(--nav2)}.node.sel{background:var(--navsel);box-shadow:inset 2px 0 0 var(--navacc);color:#fff}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;background:none;border:0;color:inherit;text-align:left;padding:0;height:100%;cursor:pointer}
.node .chev{transition:transform .1s;color:var(--navmut)}.node.open .chev{transform:rotate(90deg)}
.node .acts{display:none;gap:1px}.node:hover .acts,.node:focus-within .acts{display:flex}
.ib{width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:4px;background:none;color:var(--navmut);cursor:pointer}
.ib:hover{background:var(--navln);color:var(--navink)}.ib.dang{color:#FDA4AF}
.node input{flex:1;min-width:0;height:24px;border:1px solid var(--acc);border-radius:4px;background:var(--nav);color:var(--navink);padding:0 6px}
.kids{margin-left:13px;border-left:1px solid var(--navln);padding-left:4px}
.navf{padding:10px 14px;border-top:1px solid var(--navln);color:var(--navmut);font-size:12px}
.hint{padding:10px 14px;color:var(--navmut)}
/* Arbeitsfläche */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:52px}
.crumb{color:var(--mut);font-size:12px}.bar h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
.bar .sp{flex:1}.satz{color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--focus);background:var(--hover)}.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:default;pointer-events:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg)}.btn.pri:hover{background:var(--acch);border-color:var(--acch)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.tag{display:inline-block;border:1px solid;border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.badge{padding:3px 10px;letter-spacing:.06em;font-size:12px}
.ok{color:var(--ok);background:var(--okbg);border-color:var(--okln)}.pruefen{color:var(--warn);background:var(--warnbg);border-color:var(--warnln)}
.fehler{color:var(--err);background:var(--errbg);border-color:var(--errln)}.ki{color:var(--ai);background:var(--aibg);border-color:var(--ailn)}
.info{color:var(--mut);background:var(--sub);border-color:var(--line)}
.panes{flex:1;display:grid;grid-template-columns:var(--c1,1fr) 10px var(--c2,1.25fr) 10px var(--c3,1fr);min-height:0;padding:10px 10px 10px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shp);overflow:hidden}
.split{background:none;cursor:col-resize;border:0;padding:0;position:relative}.split::after{content:"";position:absolute;left:4px;top:40%;bottom:40%;width:2px;border-radius:2px;background:var(--line)}.split:hover::after,.split:focus-visible::after{background:var(--focus);top:10%;bottom:10%}
.ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ph h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.tabs{display:flex;gap:2px;height:100%}.tab{border:0;background:none;padding:0 9px;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;height:100%}
.tab:hover{color:var(--ink)}.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.pb{flex:1;overflow:auto;min-height:0}.pad{padding:10px 12px}.mut{color:var(--mut)}.mono{font-family:var(--mono);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}.seg button{border:0;background:var(--panel);height:24px;padding:0 9px;font-size:12px;cursor:pointer;color:var(--mut)}
.seg button:hover{background:var(--hover)}.seg button[aria-pressed=true]{background:var(--acc);color:var(--accfg)}
pre.code{margin:0;font:12px/1.55 var(--mono);counter-reset:l;padding:6px 0}
pre.code span.l{display:block;padding:0 10px 0 46px;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.55em}
pre.code span.l::before{counter-increment:l;content:counter(l);position:absolute;left:0;width:36px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
pre.code span.l:hover{background:var(--hover)}
.k{color:var(--jk);font-weight:500}.s{color:var(--js)}.n{color:var(--jn)}
.seg3{color:var(--acc);font-weight:600}
table.map{border-collapse:collapse;width:100%;table-layout:fixed;min-width:640px}table.map th:nth-child(1){width:30px}table.map th:nth-child(2){width:18%}table.map th:nth-child(3){width:24%}table.map th:nth-child(4){width:19%}table.map td{overflow:hidden}table.map tr.why td{white-space:normal;overflow-wrap:anywhere}table.map th{position:sticky;top:0;z-index:1;background:var(--sub);text-align:left;height:32px;padding:0 8px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
table.map td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}table.map tr:hover td{background:var(--hover)}
table.map td.num{font:11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;width:28px}table.map .col{font:500 12px var(--mono)}table.map .smp{font:11px var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.map select.in{font:12px var(--mono);width:100%;height:28px}table.map input.in{height:28px}
table.map tr.ai td{background:var(--aibg)}table.map tr.ai:hover td{background:var(--aibg)}table.map tr.why td{font-size:12px;color:var(--mut);padding-top:0;border-top:0}table.map tr.ai:not(.why) td{border-bottom:0}
.status{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;min-height:26px;padding:2px 14px;background:var(--panel);border-top:1px solid var(--line);font:11px var(--mono);color:var(--mut);font-variant-numeric:tabular-nums}.status b{font-weight:600;color:var(--ink)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:var(--dim)}.dot.ok{background:var(--ok)}.dot.pruefen{background:var(--warn)}.dot.fehler{background:var(--err)}.dot.ki{background:var(--ai)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:500;color:var(--mut)}
.in{height:30px;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:0 8px;font:12px var(--mono);min-width:0;width:100%}
textarea.in{height:110px;padding:6px 8px;resize:vertical}.in:hover{border-color:var(--focus)}select.in{font-family:var(--sans);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.blk{border-bottom:1px solid var(--line)}.bh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:5px 10px;z-index:1;background:var(--sub);border-bottom:1px solid var(--line);position:sticky;top:0}
.bh select{height:26px;max-width:210px}.bh .orig{font:12px var(--mono);color:var(--mut)}
.blk.ai .bh{background:var(--aibg);border-color:var(--ailn)}
.ln{display:grid;grid-template-columns:1fr auto;gap:10px;padding:1px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}
.ln:hover{background:var(--hover)}.ln.low{background:var(--warnbg)}.ln .o{color:var(--dim);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
mark{background:none;color:var(--warn);border-bottom:2px solid var(--warn);font-weight:600}
ol.fl{list-style:none;margin:0;padding:0}ol.fl li{padding:9px 12px;border-bottom:1px solid var(--line)}
ol.fl .wo{font:500 12px var(--mono)}.tun{margin-top:4px;padding:4px 8px;border-left:2px solid var(--acc);background:var(--sub)}
table.t{border-collapse:collapse;width:100%;font:12px var(--mono)}table.t th{position:sticky;top:0;background:var(--sub);text-align:left;height:30px;padding:0 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}table.t tr:hover td{background:var(--hover)}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--mut);padding:24px}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.toast{position:fixed;right:16px;bottom:40px;max-width:420px;padding:9px 12px;border-radius:7px;border:1px solid;box-shadow:var(--shf)}
@media (max-width:980px){#app{grid-template-columns:1fr;height:auto}aside{max-height:40vh}.panes{grid-template-columns:1fr;grid-auto-rows:minmax(320px,auto)}.split{display:none}.pane{border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
<aside>
  <div class="brand"><span aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h5l6 10h5"/><path d="M4 17h5l2-3.3"/><path d="M15 7h5"/></svg></span>Stellwerk</div>
  <div class="navh"><span>Projekte</span><button class="ib" id="addroot" aria-label="Neues Projekt" title="Neues Projekt"></button></div>
  <nav class="tree" id="tree" aria-label="Projekte"></nav>
  <div class="navf">Daten bleiben auf diesem Rechner.</div>
</aside>
<main id="main"></main>
</div>
<script>
"use strict";
const ICON = {
  chev:'<path d="m9 18 6-6-6-6"/>', folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', fplus:'<path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>', down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  pen:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', send:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'
};
const icon = n => { const t = document.createElement('template'); t.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`; return t.content.firstChild; };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (k in e && k !== 'list') e[k] = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const S = { tree: {kinder: []}, vorlagen: [], sel: null, task: null, lauf: null, busy: false, edit: null, del: null, tabM: 'zuordnung', tabO: 'json' };
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 12);
async function api(method, path, body, raw) {
  const r = await fetch('/api/' + path, { method, body: raw ? body : body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ fehler: 'Unerwartete Antwort des Dienstes.' }));
  if (!r.ok) throw new Error(j.fehler || 'Fehler ' + r.status);
  return j;
}
function toast(msg, cls) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = h('div', { class: 'toast ' + (cls || 'fehler'), role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 6000); }

/* ---------- Explorer ---------- */
function find(id, list = S.tree.kinder, trail = []) { for (const n of list) { if (n.id === id) return { n, list, trail: [...trail, n] }; if (n.kinder) { const r = find(id, n.kinder, [...trail, n]); if (r) return r; } } return null; }
async function saveTree() { try { await api('PUT', 'baum', S.tree); } catch (e) { toast(e.message); } }
function addNode(parent, typ) {
  const n = { id: uid(), name: typ === 'ordner' ? 'Neuer Ordner' : 'Neue Aufgabe', typ, ...(typ === 'ordner' ? { kinder: [], offen: true } : {}) };
  (parent ? parent.kinder : S.tree.kinder).push(n); if (parent) parent.offen = true;
  S.edit = n.id; saveTree(); drawTree();
}
function drawTree() {
  const root = document.getElementById('tree'); root.replaceChildren();
  if (!S.tree.kinder.length) root.append(h('p', { class: 'hint' }, 'Noch kein Projekt. Mit + ein Projekt anlegen, z. B. „Krankenhaus A“, darunter Ordner und Aufgaben.'));
  const draw = (list, into) => list.forEach(n => {
    const isF = n.typ === 'ordner';
    const row = h('div', { class: 'node' + (S.sel === n.id ? ' sel' : '') + (isF && n.offen ? ' open' : '') });
    if (isF) { const c = icon('chev'); c.classList.add('chev'); row.append(c); }
    row.append(icon(isF ? 'folder' : 'file'));
    if (S.edit === n.id) {
      const inp = h('input', { value: n.name, 'aria-label': 'Name', onkeydown: e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = n.name; inp.blur(); } },
        onblur: () => { n.name = inp.value.trim() || n.name; S.edit = null; saveTree(); drawTree(); if (S.sel === n.id) drawMain(); } });
      row.append(inp); setTimeout(() => { inp.focus(); inp.select(); });
    } else {
      row.append(h('button', { class: 'nm', title: n.name, 'aria-expanded': isF ? String(!!n.offen) : null, onclick: () => { if (isF) { n.offen = !n.offen; saveTree(); drawTree(); } else openTask(n.id); } }, n.name));
      const acts = h('span', { class: 'acts' });
      const ib = (ic, label, fn, cls) => h('button', { class: 'ib ' + (cls || ''), 'aria-label': label, title: label, onclick: e => { e.stopPropagation(); fn(); } }, icon(ic));
      if (S.del === n.id) acts.append(ib('check', 'Wirklich löschen', () => { const f = find(n.id); f.list.splice(f.list.indexOf(n), 1); if (S.sel && !find(S.sel)) { S.sel = null; drawMain(); } S.del = null; saveTree(); drawTree(); }, 'dang'), ib('x', 'Abbrechen', () => { S.del = null; drawTree(); }));
      else { if (isF) acts.append(ib('fplus', 'Ordner darunter anlegen', () => addNode(n, 'ordner')), ib('plus', 'Aufgabe darunter anlegen', () => addNode(n, 'aufgabe')));
        acts.append(ib('pen', 'Umbenennen', () => { S.edit = n.id; drawTree(); }), ib('trash', 'Löschen', () => { S.del = n.id; drawTree(); })); }
      row.append(acts);
    }
    into.append(row);
    if (isF && n.offen) { const k = h('div', { class: 'kids' }); draw(n.kinder, k); if (!n.kinder.length) k.append(h('div', { class: 'hint', style: 'padding:4px 8px' }, 'leer')); into.append(k); }
  });
  draw(S.tree.kinder, root);
}

/* ---------- Aufgabe ---------- */
async function openTask(id) { S.sel = id; S.lauf = null; S.task = null; S.tabM = 'zuordnung'; S.tabO = 'json'; drawTree(); drawMain(); try { S.task = await api('GET', 'aufgabe/' + id); drawMain(); if (S.task.quelle || (S.task.art === 'sql' && S.task.abfrage)) run(); } catch (e) { toast(e.message); } }
async function saveTask() { const { quelle, ...t } = S.task; S.task = await api('PUT', 'aufgabe/' + S.sel, t); }
async function run() {
  if (S.busy) return; S.busy = true; drawMain();
  try { await saveTask(); S.lauf = await api('POST', 'aufgabe/' + S.sel + '/lauf'); }
  catch (e) { S.lauf = null; toast(e.message); }
  S.busy = false; drawMain();
}
async function upload(file) { try { S.task = await api('POST', 'aufgabe/' + S.sel + '/quelle?name=' + encodeURIComponent(file.name), file, true); run(); } catch (e) { toast(e.message); } }
function setAlias(heading, key) { S.task.aliase = { ...S.task.aliase, [heading]: key }; run(); }

function jsonHtml(obj) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
